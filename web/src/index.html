<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ESP32-CAM</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="bg-neutral-950 text-neutral-200 min-h-screen flex flex-col">
  <div class="toggle-on toggle-off hidden"></div>
  <!-- top bar -->
  <div class="w-full max-w-7xl mx-auto py-2 px-4 flex justify-between">
    <span class="text-neutral-400 text-sm">传感器网关</span>
    <button id="theme-btn" class="text-sm">☀</button>
  </div>
  <div class="flex-1 flex items-center justify-center p-4">
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-7xl w-full">

    <!-- operations card -->
    <div class="bg-neutral-900 p-4">

      <div class="space-y-3">
        <label class="block text-sm text-neutral-400">帧尺寸</label>
        <select id="framesize" class="w-full bg-neutral-800 border-0 p-1 text-neutral-200 text-sm">
          <option value="10">VGA(640x480)</option>
          <option value="9">HVGA(480x320)</option>
          <option value="8">CIF(400x296)</option>
          <option value="6">QVGA(320x240)</option>
          <option value="5">240x240</option>
          <option value="4">HQVGA(240x176)</option>
          <option value="0">96x96</option>
        </select>
      </div>

      <div class="space-y-1">
        <label class="text-sm text-neutral-400">画质 <span id="quality-val" class="text-accent">10</span></label>
        <input type="range" id="quality" min="4" max="63" value="10" class="w-full">
      </div>
      <div class="space-y-1">
        <label class="text-sm text-neutral-400">亮度 <span id="brightness-val" class="text-accent">0</span></label>
        <input type="range" id="brightness" min="-2" max="2" value="0" class="w-full">
      </div>
      <div class="space-y-1">
        <label class="text-sm text-neutral-400">对比度 <span id="contrast-val" class="text-accent">0</span></label>
        <input type="range" id="contrast" min="-2" max="2" value="0" class="w-full">
      </div>
      <div class="space-y-1">
        <label class="text-sm text-neutral-400">饱和度 <span id="saturation-val" class="text-accent">0</span></label>
        <input type="range" id="saturation" min="-2" max="2" value="0" class="w-full">
      </div>

      <div class="space-y-1">
        <label class="text-sm text-neutral-400">LED <span id="led_intensity-val" class="text-accent">0</span></label>
        <input type="range" id="led_intensity" min="0" max="255" value="0" class="w-full">
      </div>

      <!-- toggle buttons: 2 per row -->
      <div class="grid grid-cols-2 gap-2 mt-3" id="toggles"></div>

      <!-- stream controls -->
      <div class="flex gap-2 mt-3">
        <button id="get-still" class="flex-1 py-1.5 text-sm">拍照</button>
        <button id="toggle-stream" class="flex-1 py-1.5 text-sm">推流</button>
      </div>
    </div>

    <!-- info card -->
    <div class="bg-neutral-900 p-4">
      <!-- sensor preview -->
      <div>
        <div class="flex justify-end mb-2">
          <button id="refresh-sensors" class="mt-1 text-sm px-3 py-1">刷新</button> <span id="v-nrf" class="text-xs"></span>
        </div>
        <div class="grid grid-cols-2 gap-2 text-sm mt-2">
          <div class="bg-neutral-800 p-2 flex flex-col justify-center" style="aspect-ratio:5/3"><span class="text-neutral-400 text-xs">温度</span><span id="v-temp" class="text-neutral-200">--°C</span></div>
          <div class="bg-neutral-800 p-2 flex flex-col justify-center" style="aspect-ratio:5/3"><span class="text-neutral-400 text-xs">光强</span><span id="v-light" class="text-neutral-200">--</span></div>
          <div class="bg-neutral-800 p-2 flex flex-col justify-center" style="aspect-ratio:5/3"><span class="text-neutral-400 text-xs">距离</span><span id="v-dist" class="text-neutral-200">--cm</span></div>
          <div class="bg-neutral-800 p-2 flex flex-col justify-center" style="aspect-ratio:5/3"><span class="text-neutral-400 text-xs">红外</span><span id="v-ir" class="text-neutral-200">--</span></div>
        </div>
      </div>
      <div id="stream-container" class="hidden mt-3 pt-3 border-t border-neutral-800">
        <div class="flex gap-2 mb-1">
          <a id="save-still" href="#" class="button flex-1 text-center text-sm px-3 py-1">下载</a>
          <button id="close-stream" class="flex-1 text-sm px-3 py-1">关闭</button>
        </div>
        <img id="stream" src="" class="w-full" crossorigin>
      </div>
      <div id="stream-placeholder" class="text-neutral-600 text-sm">点击「推流」开始</div>
    </div>

    <!-- placeholder card -->
    <div class="bg-neutral-900 p-4">
      <div class="space-y-1">
        <label class="text-sm text-neutral-400">风机 <span id="fan-val" class="text-accent">0</span></label>
        <input type="range" id="fan" min="0" max="100" value="0" class="w-full">
      </div>
      <div class="space-y-1 mt-3">
        <label class="text-sm text-neutral-400">水泵 <span id="pump-val" class="text-accent">0</span></label>
        <input type="range" id="pump" min="0" max="100" value="0" class="w-full">
      </div>
      <div class="flex justify-end mt-3">
        <button id="misc-toggle" class="toggle-btn toggle-off text-sm px-3 py-1">?? OFF</button>
      </div>
    </div>

  </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
